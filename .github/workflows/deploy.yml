name: GitHub Pages へ公開

on:
  push:
    branches: [main]
  # Actions の画面から手動でも実行できるようにする
  workflow_dispatch:

# 公開に必要な最小限の権限だけを与える
permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に 1 つだけ。進行中のものは途中で止めず、最後まで走らせる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 手元と同じ Node を使う
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # テストか型チェック（build に含まれる）が落ちたら、ここで止まって公開されない
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
